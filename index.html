<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>時空膠囊與未來信件產生器</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        .gradient-bg {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
    </style>
</head>
<body class="gradient-bg min-h-screen text-slate-100 font-sans antialiased pb-12">

    <nav class="max-w-6xl mx-auto px-4 py-6 flex justify-between items-center border-b border-slate-800 mb-8">
        <div class="flex items-center gap-3">
            <div class="bg-indigo-600 p-2.5 rounded-xl shadow-lg shadow-indigo-500/30">
                <i class="fa-solid fa-hourglass-half text-xl text-white animate-spin"></i>
            </div>
            <span class="text-xl font-bold bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 bg-clip-text text-transparent">Chronos 時空膠囊</span>
        </div>
        <div class="text-xs text-slate-400 bg-slate-900/80 px-3 py-1.5 rounded-full border border-slate-800">
            <i class="fa-solid fa-circle text-emerald-400 mr-1.5 animate-pulse"></i> 離線本機加密儲存已啟用
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-4 grid grid-cols-1 lg:grid-cols-12 gap-8">
        <section class="lg:col-span-5 glass-card p-6 rounded-2xl shadow-xl flex flex-col gap-5">
            <div class="border-b border-slate-800 pb-3">
                <h2 class="text-lg font-semibold text-indigo-300 flex items-center gap-2">
                    <i class="fa-solid fa-pen-fancy"></i> 撰寫一封未來信件
                </h2>
                <p class="text-xs text-slate-400 mt-1">寫下此時的心情，寄給未來的自己或重要的人。</p>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-400">寄件人 / 暱稱</label>
                <input type="text" id="sender" placeholder="例如：二十歲的自己" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-400">此時此刻的心情氛圍</label>
                <div class="grid grid-cols-5 gap-2" id="mood-selector">
                    <button onclick="selectMood('🚀', 'indigo', event)" class="mood-btn p-2.5 rounded-xl bg-slate-950/40 border border-slate-800 text-xl hover:scale-105 transition-all text-center">🚀</button>
                    <button onclick="selectMood('☕', 'amber', event)" class="mood-btn p-2.5 rounded-xl bg-slate-950/40 border border-slate-800 text-xl hover:scale-105 transition-all text-center">☕</button>
                    <button onclick="selectMood('🌱', 'emerald', event)" class="mood-btn p-2.5 rounded-xl bg-slate-950/40 border border-slate-800 text-xl hover:scale-105 transition-all text-center">🌱</button>
                    <button onclick="selectMood('🌧️', 'blue', event)" class="mood-btn p-2.5 rounded-xl bg-slate-950/40 border border-slate-800 text-xl hover:scale-105 transition-all text-center">🌧️</button>
                    <button onclick="selectMood('❤️', 'pink', event)" class="mood-btn p-2.5 rounded-xl bg-slate-950/40 border border-slate-800 text-xl hover:scale-105 transition-all text-center">❤️</button>
                </div>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-400">信件內容</label>
                <textarea id="content" rows="5" placeholder="寫點什麼吧... 你現在在煩惱什麼？你希望未來的你達成了什麼目標？" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors resize-none"></textarea>
            </div>

            <div class="flex flex-col gap-1.5">
                <label class="text-xs font-medium text-slate-400">設定開啟時間</label>
                <div class="grid grid-cols-3 gap-2 mb-2">
                    <button onclick="setTimeShortcut(1)" class="text-xs py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors">1 分鐘後 (測試)</button>
                    <button onclick="setTimeShortcut(1440)" class="text-xs py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors">1 天後</button>
                    <button onclick="setTimeShortcut(525600)" class="text-xs py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 transition-colors">1 年後</button>
                </div>
                <input type="datetime-local" id="unlock-time" class="w-full bg-slate-950/50 border border-slate-800 rounded-xl px-4 py-2.5 text-sm focus:outline-none focus:border-indigo-500 transition-colors text-slate-300">
            </div>

            <button onclick="sealCapsule()" class="w-full mt-2 bg-gradient-to-r from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 text-white font-medium py-3 rounded-xl shadow-lg shadow-indigo-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2 cursor-pointer">
                <i class="fa-solid fa-box-archive"></i> 注入能量，封存時空膠囊
            </button>
        </section>

        <section class="lg:col-span-7 flex flex-col gap-4">
            <div class="glass-card p-4 rounded-xl flex justify-between items-center">
                <h2 class="text-md font-semibold text-purple-300 flex items-center gap-2">
                    <i class="fa-solid fa-vault"></i> 我的時光地下室
                </h2>
                <span id="capsule-count" class="text-xs bg-purple-950 text-purple-300 border border-purple-800 px-2.5 py-0.5 rounded-full">0 個膠囊</span>
            </div>

            <div id="capsules-container" class="flex flex-col gap-4 overflow-y-auto max-h-[600px] pr-1">
                <div class="text-center py-16 text-slate-500 glass-card rounded-2xl border-dashed border-slate-800">
                    <i class="fa-solid fa-box-open text-4xl mb-3 block text-slate-600"></i>
                    <p class="text-sm">目前沒有封存的時空膠囊</p>
                    <p class="text-xs text-slate-600 mt-1">在左側寫下第一封信來啟動時間穿梭吧！</p>
                </div>
            </div>
        </section>
    </main>

    <div id="read-modal" class="fixed inset-0 bg-black/80 backdrop-blur-md flex items-center justify-center p-4 hidden z-50">
        <div class="glass-card w-full max-w-xl rounded-2xl border border-amber-500/30 overflow-hidden animate__animated animate__zoomIn">
            <div class="bg-gradient-to-r from-amber-950/40 to-purple-950/40 p-4 border-b border-slate-800 flex justify-between items-center">
                <span class="text-amber-400 font-bold text-sm"><i class="fa-solid fa-envelope-open-text mr-1.5"></i> 成功解鎖時空密信</span>
                <button onclick="closeModal()" class="text-slate-400 hover:text-white"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="p-6 bg-slate-900/60 flex flex-col gap-4">
                <div class="flex justify-between items-center text-xs text-slate-400">
                    <span>來自：<strong id="modal-sender" class="text-slate-200"></strong></span>
                    <span>封存於：<span id="modal-created"></span></span>
                </div>
                <div class="bg-amber-50/5 text-slate-200 p-5 rounded-xl border border-amber-500/10 min-h-[150px] whitespace-pre-wrap text-sm leading-relaxed tracking-wide shadow-inner" id="modal-content"></div>
                <div class="flex justify-between items-center mt-2">
                    <span id="modal-mood" class="text-2xl bg-slate-800 px-3 py-1 rounded-xl"></span>
                    <button onclick="closeModal()" class="bg-slate-800 hover:bg-slate-700 px-5 py-2 text-xs rounded-xl font-medium transition-colors">關閉並妥善收藏</button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-slate-900 border border-slate-700 px-5 py-3 rounded-xl text-sm hidden shadow-2xl z-50 flex items-center gap-2"></div>

    <script>
        let selectedMood = '🚀';
        let selectedTheme = 'indigo';
        let capsules = [];

        document.addEventListener('DOMContentLoaded', () => {
            if(localStorage.getItem('chronos_capsules')) {
                capsules = JSON.parse(localStorage.getItem('chronos_capsules'));
            }
            const firstMoodBtn = document.querySelector('.mood-btn');
            if (firstMoodBtn) {
                firstMoodBtn.className = 'mood-btn p-2.5 rounded-xl bg-indigo-950/50 border-2 border-indigo-500 text-xl scale-105 transition-all text-center shadow-lg shadow-indigo-500/10';
            }
            renderCapsules();
            setInterval(renderCapsules, 1000);
        });

        function selectMood(mood, theme, event) {
            selectedMood = mood;
            selectedTheme = theme;
            document.querySelectorAll('.mood-btn').forEach(btn => {
                btn.className = 'mood-btn p-2.5 rounded-xl bg-slate-950/40 border border-slate-800 text-xl hover:scale-105 transition-all text-center';
            });
            event.currentTarget.className = `mood-btn p-2.5 rounded-xl bg-${theme}-950/50 border-2 border-${theme}-500 text-xl scale-105 transition-all text-center shadow-lg shadow-${theme}-500/10`;
        }

        function setTimeShortcut(minutes) {
            const now = new Date();
            now.setMinutes(now.getMinutes() + minutes);
            const tzoffset = (new Date()).getTimezoneOffset() * 60000; 
            const localISOTime = (new Date(now - tzoffset)).toISOString().slice(0, 16);
            document.getElementById('unlock-time').value = localISOTime;
            showToast("✨ 時間已快速設定！");
        }

        function showToast(text) {
            const toast = document.getElementById('toast');
            toast.innerHTML = `<i class="fa-solid fa-circle-info text-indigo-400"></i> \${text}`;
            toast.classList.remove('hidden');
            toast.classList.add('animate__animated', 'animate__fadeInUp');
            setTimeout(() => {
                toast.classList.remove('animate__fadeInUp');
                toast.classList.add('animate__fadeOutDown');
                setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('animate__fadeOutDown');
                }, 500);
            }, 3000);
        }

        function sealCapsule() {
            const sender = document.getElementById('sender').value.trim();
            const content = document.getElementById('content').value.trim();
            const unlockTimeStr = document.getElementById('unlock-time').value;

            if(!sender || !content || !unlockTimeStr) {
                alert("請填寫完整的暱稱、內容並設定未來的解鎖時間！");
                return;
            }

            const unlockTimestamp = new Date(unlockTimeStr).getTime();
            if(unlockTimestamp <= Date.now()) {
                alert("開啟時間必須設定在未來的時間點哦！");
                return;
            }

            const newCapsule = {
                id: 'cap_' + Date.now(),
                sender: sender,
                content: content,
                mood: selectedMood,
                theme: selectedTheme,
                createdAt: new Date().toLocaleDateString() + ' ' + new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}),
                unlockTime: unlockTimestamp
            };

            capsules.unshift(newCapsule);
            localStorage.setItem('chronos_capsules', JSON.stringify(capsules));
            
            document.getElementById('sender').value = '';
            document.getElementById('content').value = '';
            document.getElementById('unlock-time').value = '';
            
            showToast("🔒 膠囊已成功封存至時光地下室！");
            renderCapsules();
        }

        function renderCapsules() {
            const container = document.getElementById('capsules-container');
            if (!container) return;
            document.getElementById('capsule-count').innerText = `\${capsules.length} 個膠囊`;

            if(capsules.length === 0) {
                container.innerHTML = `
                    <div class="text-center py-16 text-slate-500 glass-card rounded-2xl border-dashed border-slate-800">
                        <i class="fa-solid fa-box-open text-4xl mb-3 block text-slate-600"></i>
                        <p class="text-sm">目前沒有封存的時空膠囊</p>
                        <p class="text-xs text-slate-600 mt-1">在左側寫下第一封信來啟動時間穿梭吧！</p>
                    </div>
                `;
                return;
            }

            let htmlString = '';
            const now = Date.now();

            capsules.forEach(cap => {
                const isReady = now >= cap.unlockTime;
                let statusBadge = '';
                let actionButton = '';

                if(isReady) {
                    statusBadge = `<span class="text-xs bg-emerald-950/80 text-emerald-400 border border-emerald-800 px-2.5 py-0.5 rounded-full flex items-center gap-1 animate-pulse"><i class="fa-solid fa-lock-open text-[10px]"></i>已到達指定時空</span>`;
                    actionButton = `<button onclick="openCapsule('\${cap.id}')" class="px-4 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 text-white text-xs font-bold rounded-xl transition-all cursor-pointer shadow-lg shadow-emerald-500/20 active:scale-95"><i class="fa-solid fa-envelope-open mr-1"></i> 開啟密信</button>`;
                } else {
                    const timeLeft = cap.unlockTime - now;
                    const days = Math.floor(timeLeft / (1000 * 60 * 60 * 24));
                    const hours = Math.floor((timeLeft % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                    const minutes = Math.floor((timeLeft % (1000 * 60 * 60)) / (1000 * 60));
                    const seconds = Math.floor((timeLeft % (1000 * 60)) / 1000);
                    
                    let countdownText = '';
                    if(days > 0) countdownText += `\${days}天 `;
                    countdownText += `\${hours.toString().padStart(2,'0')}:\${minutes.toString().padStart(2,'0')}:\${seconds.toString().padStart(2,'0')}`;

                    statusBadge = `<span class="text-xs bg-slate-800/80 text-slate-400 border border-slate-700 px-2.5 py-0.5 rounded-full flex items-center gap-1"><i class="fa-solid fa-hourglass text-[10px] text-indigo-400 animate-pulse"></i>穿梭中：\${countdownText}</span>`;
                    actionButton = `<button onclick="alert('時光機尚未抵達！請再等待一段時間。')" class="px-4 py-2 bg-slate-800 text-slate-500 text-xs font-medium rounded-xl cursor-not-allowed flex items-center gap-1"><i class="fa-solid fa-lock text-[10px]"></i> 鎖定中</button>`;
                }

                htmlString += `
                    <div class="glass-card p-4 rounded-xl border-l-4 border-\${cap.theme}-500 flex flex-col gap-3 transition-transform hover:translate-x-1 duration-200">
                        <div class="flex justify-between items-start gap-2">
                            <div class="flex items-center gap-2.5">
                                <span class="text-xl bg-slate-900/60 w-10 h-10 rounded-lg flex items-center justify-center border border-slate-800">\${cap.mood}</span>
                                <div>
                                    <h4 class="text-sm font-semibold text-slate-200">給：\${cap.sender}</h4>
                                    <p class="text-[11px] text-slate-500">封存時間：\${cap.createdAt}</p>
                                </div>
                            </div>
                            <button onclick="deleteCapsule('\${cap.id}')" class="text-slate-600 hover:text-rose-400 text-xs p-1 transition-colors" title="銷毀此膠囊"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                        <div class="flex justify-between items-center pt-1 border-t border-slate-800/60 mt-1">
                            \${statusBadge}
                            \${actionButton}
                        </div>
                    </div>
                `;
            });

            container.innerHTML = htmlString;
        }

        function openCapsule(id) {
            const cap = capsules.find(c => c.id === id);
            if(!cap) return;

            document.getElementById('modal-sender').innerText = cap.sender;
            document.getElementById('modal-created').innerText = cap.createdAt;
            document.getElementById('modal-content').innerText = cap.content;
            document.getElementById('modal-mood').innerText = `當時心情：\${cap.mood}`;

            document.getElementById('read-modal').classList.remove('hidden');

            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });
        }

        function closeModal() {
            document.getElementById('read-modal').classList.add('hidden');
        }

        function deleteCapsule(id) {
            if(confirm("確定要徹底銷毀這個時空膠囊嗎？裡面的信件將會永遠消失在虛空中！")) {
                capsules = capsules.filter(c => c.id !== id);
                localStorage.setItem('chronos_capsules', JSON.stringify(capsules));
                renderCapsules();
                showToast("🗑️ 膠囊已被送入太空中銷毀。");
            }
        }
    </script>
</body>
</html>
